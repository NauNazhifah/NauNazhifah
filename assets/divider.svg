      <stop offset="0%" stop-color="#a10325" stop-opacity="0"/>
      <stop offset="60%" stop-color="#a10325" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97127"/>
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97127"/>
      <stop offset="40%" stop-color="#a10325" stop-opacity="0.8"/>
