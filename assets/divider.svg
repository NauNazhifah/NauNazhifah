    <polygon points="0,-8 2.5,-2.5 8,0 2.5,2.5 0,8 -2.5,2.5 -8,0 -2.5,-2.5" fill="#f0dba3"/>
    <circle cx="0" cy="0" r="1.5" fill="#a10325"/>
    <circle cx="-16" cy="0" r="2.5" fill="#d97127"/>
    <circle cx="16" cy="0" r="2.5" fill="#d97127"/>
  </g>

  <!-- Right Line -->
