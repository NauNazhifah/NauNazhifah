<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a0014" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#80021d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5a0014" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a10325"/>
      <stop offset="35%" stop-color="#d97127"/>
      <stop offset="70%" stop-color="#f0dba3"/>
      <stop offset="100%" stop-color="#a10325"/>
    </linearGradient>
  </defs>
  <style>
    .footer-quote {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 14.5px;
      fill: #f0dba3;
      letter-spacing: 0.5px;
    }
    .footer-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #ffffff;
      opacity: 0.75;
    }
  </style>

  <rect x="50" y="10" width="800" height="70" rx="35" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.5"/>
  <text x="450" y="42" text-anchor="middle" class="footer-quote">✨ “Never lose an opportunity of urging a practical beginning — stay curious.” ✨</text>
  <text x="450" y="62" text-anchor="middle" class="footer-sub">Designed with passion • Crafted for @NauNazhifah</text>
</svg>
