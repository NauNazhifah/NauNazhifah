<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a0014"/>
      <stop offset="45%" stop-color="#80021d"/>
      <stop offset="85%" stop-color="#a10325"/>
      <stop offset="100%" stop-color="#b83818"/>
    </linearGradient>

    <!-- Warm Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a10325"/>
      <stop offset="50%" stop-color="#d97127"/>
      <stop offset="100%" stop-color="#f0dba3"/>
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fff2d6"/>
      <stop offset="100%" stop-color="#f0dba3"/>
    </linearGradient>

    <linearGradient id="orangePillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97127" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f0dba3" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: url(#goldTextGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #5a0014;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 17px;
      fill: #f0dba3;
      letter-spacing: 0.3px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-style: italic;
      font-size: 14.5px;
      fill: #ffffff;
      opacity: 0.92;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #f0dba3;
    }
    .sparkle {
      fill: #f0dba3;
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
  </style>

  <!-- Base Card with Rounded Corners -->
  <rect width="920" height="280" rx="20" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Decorative Abstract Gradient Waves -->
  <path d="M0 200 C 200 240, 350 160, 550 210 C 750 260, 850 200, 920 220 L 920 280 L 0 280 Z" fill="#d97127" fill-opacity="0.25"/>
  <path d="M0 225 C 220 265, 400 185, 620 235 C 780 270, 860 230, 920 250 L 920 280 L 0 280 Z" fill="#f0dba3" fill-opacity="0.2"/>
  
  <!-- Top Right Glowing Sun Sphere -->
  <circle cx="830" cy="50" r="140" fill="#d97127" fill-opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="830" cy="50" r="80" fill="#f0dba3" fill-opacity="0.3" filter="url(#softGlow)"/>
  <circle cx="830" cy="50" r="30" fill="#ffffff" fill-opacity="0.4" filter="url(#softGlow)"/>

  <!-- Decorative Orbit Rings -->
  <ellipse cx="830" cy="50" rx="110" ry="40" fill="none" stroke="#f0dba3" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.45" transform="rotate(-25 830 50)"/>
  <ellipse cx="830" cy="50" rx="160" ry="60" fill="none" stroke="#d97127" stroke-width="1" opacity="0.3" transform="rotate(15 830 50)"/>

  <!-- Sparkles / Stars -->
  <!-- Star 1 -->
  <path class="sparkle" d="M 720 70 Q 720 85 735 85 Q 720 85 720 100 Q 720 85 705 85 Q 720 85 720 70 Z" opacity="0.85"/>
  <!-- Star 2 -->
  <path class="sparkle" d="M 640 140 Q 640 148 648 148 Q 640 148 640 156 Q 640 148 632 148 Q 640 148 640 140 Z" opacity="0.7"/>
  <!-- Star 3 -->
  <path class="sparkle" d="M 120 45 Q 120 52 127 52 Q 120 52 120 59 Q 120 52 113 52 Q 120 52 120 45 Z" opacity="0.6"/>
  <!-- Small glowing dots -->
  <circle cx="680" cy="110" r="2.5" fill="#f0dba3" opacity="0.6"/>
  <circle cx="760" cy="170" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="160" cy="35" r="1.8" fill="#f0dba3" opacity="0.5"/>
  <circle cx="880" cy="140" r="3" fill="#f0dba3" opacity="0.4"/>

  <!-- Inner Frame Accent Border -->
  <rect x="15" y="15" width="890" height="250" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Content Group -->
  <g transform="translate(55, 45)">
    <!-- Status / Mini Pill Badge -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="url(#orangePillGrad)"/>
    <text x="90" y="17" text-anchor="middle" class="badge-text">✦ MAHASISWA &amp; EXPLORER ✦</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title">Naurah Nazhifah</text>

    <!-- Subtitle -->
    <text x="0" y="98" class="subtitle">A Curious Person • Lifelong Learner • Tech Enthusiast</text>

    <!-- Tagline Card Container -->
    <rect x="0" y="118" width="560" height="38" rx="8" fill="#000000" fill-opacity="0.25" stroke="#d97127" stroke-width="1" stroke-opacity="0.5"/>
    <text x="18" y="142" class="tagline">“Stay curious — asking questions is the first step to building great things.”</text>

    <!-- Interactive-feel Metadata Pills -->
    <g transform="translate(0, 172)">
      <!-- Pill 1: GitHub -->
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#5a0014" fill-opacity="0.7" stroke="#d97127" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#f0dba3"/>
      <text x="30" y="18" class="pill-label">@NauNazhifah</text>

      <!-- Pill 2: Status -->
      <rect x="145" y="0" width="125" height="28" rx="14" fill="#5a0014" fill-opacity="0.7" stroke="#d97127" stroke-width="1"/>
      <circle cx="161" cy="14" r="5" fill="#d97127"/>
      <text x="175" y="18" class="pill-label">🎓 Mahasiswa</text>

      <!-- Pill 3: Passion -->
      <rect x="280" y="0" width="165" height="28" rx="14" fill="#5a0014" fill-opacity="0.7" stroke="#d97127" stroke-width="1"/>
      <circle cx="296" cy="14" r="5" fill="#f0dba3"/>
      <text x="310" y="18" class="pill-label">🔍 Endless Curiosity</text>
    </g>
  </g>
</svg>
