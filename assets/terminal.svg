<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Burgundy & Obsidian) -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140106"/>
      <stop offset="40%" stop-color="#23030d"/>
      <stop offset="75%" stop-color="#2c0411"/>
      <stop offset="100%" stop-color="#160107"/>
    </linearGradient>

    <!-- Header Bar Gradient -->
    <linearGradient id="headerBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c0104"/>
      <stop offset="50%" stop-color="#1a0208"/>
      <stop offset="100%" stop-color="#0c0104"/>
    </linearGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="termBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a10325"/>
      <stop offset="35%" stop-color="#d97127"/>
      <stop offset="70%" stop-color="#f0dba3"/>
      <stop offset="100%" stop-color="#a10325"/>
    </linearGradient>

    <!-- ASCII Logo Gradient -->
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0dba3"/>
      <stop offset="50%" stop-color="#d97127"/>
      <stop offset="100%" stop-color="#a10325"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="termGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d97127" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Source Code Pro', Menlo, Monaco, Consolas, 'Courier New', monospace;
    }
    .term-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12.5px;
      fill: #f0dba3;
      letter-spacing: 0.5px;
    }
    .badge-online {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #f0dba3;
    }
    .prompt-user {
      font-weight: 700;
      fill: #d97127;
      font-size: 13.5px;
    }
    .prompt-symbol {
      font-weight: 600;
      fill: #f0dba3;
      font-size: 13.5px;
    }
    .prompt-cmd {
      font-weight: 500;
      fill: #ffffff;
      font-size: 13.5px;
    }
    .ascii-text {
      font-weight: 800;
      font-size: 13px;
      fill: url(#asciiGrad);
      letter-spacing: 1px;
    }
    .ascii-tag {
      font-weight: 700;
      font-size: 11px;
      fill: #f0dba3;
      letter-spacing: 2px;
    }
    .meta-key {
      font-weight: 600;
      font-size: 12px;
      fill: #d97127;
    }
    .meta-val {
      font-weight: 400;
      font-size: 12px;
      fill: #fdf6e7;
    }
    .bio-key {
      font-weight: 600;
      font-size: 13px;
      fill: #f0dba3;
    }
    .bio-colon {
      font-weight: 600;
      font-size: 13px;
      fill: #d97127;
    }
    .bio-val {
      font-weight: 400;
      font-size: 13px;
      fill: #ffffff;
    }
    .bio-val-highlight {
      font-weight: 700;
      font-size: 13px;
      fill: #fdf6e7;
    }
    .bio-val-accent {
      font-weight: 500;
      font-size: 13px;
      fill: #d97127;
    }
    .quote-text {
      font-style: italic;
      font-size: 13px;
      fill: #f0dba3;
      opacity: 0.95;
    }
    .cursor {
      animation: blink 1s infinite steps(2, start);
      fill: #d97127;
      font-weight: 900;
      font-size: 15px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Outer Card Frame with Rounded Corners & Shadow -->
  <rect x="10" y="10" width="900" height="540" rx="16" fill="url(#termBg)" stroke="url(#termBorderGrad)" stroke-width="1.8" filter="url(#termShadow)"/>

  <!-- Subtle Tech Grid -->
  <rect x="10" y="44" width="900" height="506" rx="0" fill="url(#termGrid)"/>

  <!-- Top Window Header Bar -->
  <path d="M 10 26 C 10 17.16 17.16 10 26 10 L 894 10 C 902.84 10 910 17.16 910 26 L 910 44 L 10 44 Z" fill="url(#headerBarGrad)"/>
  <line x1="10" y1="44" x2="910" y2="44" stroke="#a10325" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Window Control Traffic Lights -->
  <g transform="translate(30, 27)">
    <!-- Close (Crimson / Red) -->
    <circle cx="0" cy="0" r="6" fill="#e03131"/>
    <circle cx="0" cy="0" r="4.5" fill="#a10325" fill-opacity="0.3"/>
    <!-- Minimize (Amber / Terracotta) -->
    <circle cx="20" cy="0" r="6" fill="#f59f00"/>
    <circle cx="20" cy="0" r="4.5" fill="#d97127" fill-opacity="0.3"/>
    <!-- Maximize (Green / Mint) -->
    <circle cx="40" cy="0" r="6" fill="#2fb344"/>
    <circle cx="40" cy="0" r="4.5" fill="#f0dba3" fill-opacity="0.2"/>
  </g>

  <!-- Window Header Title -->
  <text x="460" y="32" text-anchor="middle" class="term-title">naurah@portfolio: ~/biodata-lengkap (read-only model)</text>

  <!-- Header Right Mini Badge (Visual Model Indicator) -->
  <g transform="translate(775, 18)">
    <rect x="0" y="0" width="115" height="18" rx="9" fill="#5a0014" fill-opacity="0.85" stroke="#d97127" stroke-width="0.8"/>
    <circle cx="12" cy="9" r="3.5" fill="#d97127"/>
    <text x="64" y="13" text-anchor="middle" class="badge-online">READ-ONLY</text>
  </g>

  <!-- Content Area (Monospace) -->
  <g class="code-font" transform="translate(35, 75)">
    
    <!-- Command 1: Neofetch / Bio Fetch -->
    <text x="0" y="0">
      <tspan class="prompt-user">naurah@portfolio</tspan>
      <tspan class="prompt-symbol">:</tspan>
      <tspan class="prompt-symbol">~</tspan>
      <tspan class="prompt-symbol">$ </tspan>
      <tspan class="prompt-cmd">neofetch --profile NauNazhifah</tspan>
    </text>

    <!-- LEFT COLUMN: Neofetch ASCII Logo & OS Specs (x: 0 to 250) -->
    <g transform="translate(5, 26)">
      <!-- Stylized Monogram NN (Naurah Nazhifah) in glowing gradient -->
      <text x="0" y="0" class="ascii-text">███╗   ██╗ ███╗   ██╗</text>
      <text x="0" y="17" class="ascii-text">████╗  ██║ ████╗  ██║</text>
      <text x="0" y="34" class="ascii-text">██╔██╗ ██║ ██╔██╗ ██║</text>
      <text x="0" y="51" class="ascii-text">██║╚██╗██║ ██║╚██╗██║</text>
      <text x="0" y="68" class="ascii-text">██║ ╚████║ ██║ ╚████║</text>
      <text x="0" y="85" class="ascii-text">╚═╝  ╚═══╝ ╚═╝  ╚═══╝</text>

      <text x="0" y="112" class="ascii-tag">── NAURAH NAZHIFAH ──</text>

      <!-- System Metadata Details -->
      <g transform="translate(0, 134)">
        <text x="0" y="0">
          <tspan class="meta-key">OS       : </tspan>
          <tspan class="meta-val">NaurahOS (Curiosity Ed.)</tspan>
        </text>
        <text x="0" y="20">
          <tspan class="meta-key">Host     : </tspan>
          <tspan class="meta-val">BioGitHub Portfolio</tspan>
        </text>
        <text x="0" y="40">
          <tspan class="meta-key">Kernel   : </tspan>
          <tspan class="meta-val">Lifelong-Learner x64</tspan>
        </text>
        <text x="0" y="60">
          <tspan class="meta-key">Uptime   : </tspan>
          <tspan class="meta-val">Mahasiswa Aktif 🎓</tspan>
        </text>
        <text x="0" y="80">
          <tspan class="meta-key">Shell    : </tspan>
          <tspan class="meta-val">zsh 5.9 (pure-prompt)</tspan>
        </text>
        <text x="0" y="100">
          <tspan class="meta-key">Terminal : </tspan>
          <tspan class="meta-val">NazhiTerm-GUI</tspan>
        </text>
        <text x="0" y="120">
          <tspan class="meta-key">Theme    : </tspan>
          <tspan class="meta-val">Crimson &amp; Sand [Custom]</tspan>
        </text>
      </g>

      <!-- Neofetch Palette Color Blocks -->
      <g transform="translate(0, 275)">
        <rect x="0" y="0" width="30" height="12" rx="3" fill="#5a0014"/>
        <rect x="36" y="0" width="30" height="12" rx="3" fill="#80021d"/>
        <rect x="72" y="0" width="30" height="12" rx="3" fill="#a10325"/>
        <rect x="108" y="0" width="30" height="12" rx="3" fill="#d97127"/>
        <rect x="144" y="0" width="30" height="12" rx="3" fill="#f0dba3"/>
        <rect x="180" y="0" width="30" height="12" rx="3" fill="#ffffff"/>
      </g>
    </g>

    <!-- Vertical Column Divider -->
    <line x1="262" y1="22" x2="262" y2="320" stroke="#d97127" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.35"/>

    <!-- RIGHT COLUMN: Biodata Lengkap (x: 285) -->
    <g transform="translate(285, 26)">
      
      <!-- 1. Nama Lengkap -->
      <text x="0" y="0">
        <tspan class="bio-key">👤 Nama Lengkap     </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val-highlight">Naurah Nazhifah</tspan>
      </text>

      <!-- 2. Nama Panggilan -->
      <text x="0" y="21">
        <tspan class="bio-key">🏷️  Nama Panggilan   </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Nau / Nazhi</tspan>
      </text>

      <!-- 3. Status -->
      <text x="0" y="42">
        <tspan class="bio-key">🎓 Status           </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Mahasiswa Aktif</tspan>
        <tspan class="bio-val-accent"> (Continuous Learner)</tspan>
      </text>

      <!-- 4. Domisili / Lokasi -->
      <text x="0" y="63">
        <tspan class="bio-key">📍 Lokasi / Domisili </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Indonesia 🇮🇩</tspan>
      </text>

      <!-- 5. Identitas Personal -->
      <text x="0" y="84">
        <tspan class="bio-key">🔍 Personal Identity</tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">A Curious Person Exploring Technology</tspan>
      </text>

      <!-- 6. Fokus Studi -->
      <text x="0" y="105">
        <tspan class="bio-key">💻 Fokus Saat Ini   </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Modern Web Development &amp; Dasar Pemrograman</tspan>
      </text>

      <!-- 7. Tech Stack -->
      <text x="0" y="126">
        <tspan class="bio-key">⚡ Bahasa Pemrograman</tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val-highlight">HTML5 • CSS3 • JavaScript • Python</tspan>
      </text>

      <!-- 8. Tools & Workflow -->
      <text x="0" y="147">
        <tspan class="bio-key">🛠️  Tools &amp; Workflow </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">VS Code, Git, GitHub, Figma, Notion</tspan>
      </text>

      <!-- 9. Kemampuan Bahasa -->
      <text x="0" y="168">
        <tspan class="bio-key">🌐 Bahasa Komunikasi </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Bahasa Indonesia (Native), English</tspan>
      </text>

      <!-- 10. Pola Pikir / Mindset -->
      <text x="0" y="189">
        <tspan class="bio-key">🌱 Pola Pikir       </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Growth Mindset &amp; Konsisten Belajar Bertahap</tspan>
      </text>

      <!-- 11. Hobi & Kegemaran -->
      <text x="0" y="210">
        <tspan class="bio-key">🎨 Minat Eksplorasi </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Frontend Design, UI/UX, Creative Web, Open Source</tspan>
      </text>

      <!-- 12. Bahan Bakar -->
      <text x="0" y="231">
        <tspan class="bio-key">☕ Bahan Bakar      </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val">Secangkir Teh Hangat &amp; Alunan Lo-Fi Beats</tspan>
      </text>

      <!-- 13. Email -->
      <text x="0" y="252">
        <tspan class="bio-key">📬 Kontak Email     </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val-accent">naunanazhi@gmail.com</tspan>
      </text>

      <!-- 14. GitHub Profile -->
      <text x="0" y="273">
        <tspan class="bio-key">🔗 Profil GitHub    </tspan>
        <tspan class="bio-colon">: </tspan>
        <tspan class="bio-val-highlight">github.com/NauNazhifah</tspan>
      </text>

    </g>

    <!-- Bottom Terminal Divider -->
    <line x1="0" y1="332" x2="845" y2="332" stroke="#a10325" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Command 2: Output Quote -->
    <g transform="translate(0, 360)">
      <text x="0" y="0">
        <tspan class="prompt-user">naurah@portfolio</tspan>
        <tspan class="prompt-symbol">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="prompt-symbol">$ </tspan>
        <tspan class="prompt-cmd">cat quote.txt</tspan>
      </text>
      <text x="0" y="22" class="quote-text">
        ✨ “Stay curious — asking questions and exploring possibilities is the first step to building impactful things.”
      </text>
    </g>

    <!-- Command 3: Static Model Completion -->
    <g transform="translate(0, 420)">
      <text x="0" y="0">
        <tspan class="prompt-user">naurah@portfolio</tspan>
        <tspan class="prompt-symbol">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="prompt-symbol">$ </tspan>
        <tspan class="prompt-cmd">exit</tspan>
      </text>
    </g>

  </g>
</svg>
